# Codemagic CI — cloud iOS build for the Capacitor app (no Mac needed).
#
# It builds the web client, generates the iOS project (we don't commit ios/ since it needs
# macOS/CocoaPods), signs with your App Store Connect API key, and ships to TestFlight.
#
# Before the first run, set these in Codemagic:
#   1. Add your App Store Connect API key as an integration, then put its NAME below
#      (replace `turfgame-asc`).
#   2. After you create the app in App Store Connect, put its numeric Apple ID in
#      APP_STORE_APPLE_ID below.
# Everything else is automatic.
workflows:
  ios-testflight:
    name: Turfgame iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: turfgame-asc # <-- the name you give the API key integration in Codemagic
    environment:
      vars:
        # Capacitor 8 uses Swift Package Manager (no CocoaPods/Podfile/.xcworkspace) — build the project.
        XCODE_PROJECT: "client/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "io.turfgame.app"
        APP_STORE_APPLE_ID: "6780508305" # Turfgame in App Store Connect
        # Vite reads process.env.VITE_* at build time, so set the PUBLIC client config here too.
        # This guarantees accounts/shop/sign-in are enabled in the native build even if .env.production
        # isn't picked up in CI. All public (publishable key + URLs), never the secret key.
        VITE_SERVER_URL: "wss://turfgame.io/colyseus"
        VITE_SUPABASE_URL: "https://derxaiqacejjzgdqlsdr.supabase.co"
        VITE_SUPABASE_ANON_KEY: "sb_publishable_IKOiE7lmQucUIlo3300Wlw_hMF6cY4b"
        VITE_REVENUECAT_IOS_KEY: "appl_luHgNVWFQPwORSdbtcEDTYWqJxd"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web client
        script: npm run build
      - name: Add iOS platform + sync web assets
        script: |
          cd client
          npx cap add ios
          npx cap sync ios
      - name: Install shared Xcode scheme (Capacitor 8 doesn't generate one)
        script: |
          mkdir -p client/ios/App/App.xcodeproj/xcshareddata/xcschemes
          cp client/ios-config/App.xcscheme client/ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme
      - name: Configure Info.plist (compliance exemption + OAuth deep-link scheme + landscape lock)
        script: |
          PLIST="client/ios/App/App/Info.plist"
          # Standard HTTPS only → exempt, so every build auto-clears export compliance.
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO "$PLIST"
          # Register the io.turfgame.app:// URL scheme so the OAuth redirect deep-links back into the app.
          plutil -insert CFBundleURLTypes -json '[{"CFBundleURLSchemes":["io.turfgame.app"]}]' "$PLIST" 2>/dev/null \
            || plutil -replace CFBundleURLTypes -json '[{"CFBundleURLSchemes":["io.turfgame.app"]}]' "$PLIST"
          # Landscape-only, BOTH directions (iPhone + iPad). The launch splash is then landscape, the
          # portrait rotate-gate never flashes, and the device can flip between the two landscapes.
          plutil -replace UISupportedInterfaceOrientations -json '["UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"]' "$PLIST"
          plutil -replace 'UISupportedInterfaceOrientations~ipad' -json '["UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"]' "$PLIST"
      - name: Generate app icon & splash
        script: |
          cd client
          npx @capacitor/assets generate --ios --iconBackgroundColor '#0f1623' --splashBackgroundColor '#0f1623'
      - name: Set build number (Codemagic's monotonic counter — always unique)
        script: |
          cd client/ios/App
          # Use Codemagic's ever-incrementing project build number. The old "latest TestFlight + 1"
          # fell back to 1 whenever the App Store query hiccuped, so every build after the first
          # uploaded as build "1" and Apple rejected it as a duplicate (post-processing failed).
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Resolve Swift packages (Capacitor 8 SPM)
        script: |
          cd client/ios/App
          xcodebuild -list -project App.xcodeproj || true
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - name: Sign + build IPA
        script: |
          set -e
          keychain initialize
          # Apple caps distribution certificates at 2. Revoke any existing ones so repeated CI builds
          # never hit the cap (already-uploaded TestFlight/App Store builds stay valid after this).
          # Best-effort: wrapped so a CLI/JSON-shape mismatch can never fail the build.
          { app-store-connect certificates list --type IOS_DISTRIBUTION --json > /tmp/dist_certs.json 2>/dev/null \
              && python3 -c "import json;[print(c.get('id','')) for c in json.load(open('/tmp/dist_certs.json'))]" 2>/dev/null \
              | while read -r cid; do [ -n "$cid" ] && app-store-connect certificates delete "$cid"; done; } || true
          # Generate an RSA key, create the distribution cert from it, then create/fetch the App Store
          # profile, add the cert to the keychain, apply signing to the project, and archive.
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect certificates create --type IOS_DISTRIBUTION --certificate-key=@file:/tmp/cert_key.pem --save
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@file:/tmp/cert_key.pem --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
          echo "--- signing settings after use-profiles ---"
          grep -E "PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY" "$XCODE_PROJECT/project.pbxproj" | sort -u || true
          echo "------------------------------------------"
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
