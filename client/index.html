<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turfgame.io</title>

    <!-- Browser tab + search-engine icon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <meta name="theme-color" content="#0f1623" />
    <link rel="canonical" href="https://turfgame.io/" />

    <!-- Search engine -->
    <meta name="description" content="Turfgame.io is a free multiplayer .io game. Draw loops to claim turf, fight rivals in the open, siege enemy capitals, and climb the leaderboard. No download — play instantly in your browser." />

    <!-- Social share preview (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Turfgame.io" />
    <meta property="og:url" content="https://turfgame.io/" />
    <meta property="og:title" content="Turfgame.io — claim turf, siege capitals, rule the map" />
    <meta property="og:description" content="A free multiplayer .io game. Draw loops to claim land, raid rivals, siege capitals, and top the leaderboard. Play instantly in your browser." />
    <meta property="og:image" content="https://turfgame.io/logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Turfgame.io — claim turf, siege capitals, rule the map" />
    <meta name="twitter:description" content="A free multiplayer .io game. Draw loops to claim land, raid rivals, siege capitals, and top the leaderboard." />
    <meta name="twitter:image" content="https://turfgame.io/logo.png" />

    <!-- Structured data: tells Google this is a free, browser-based multiplayer game -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Turfgame.io",
        "url": "https://turfgame.io/",
        "image": "https://turfgame.io/logo.png",
        "description": "A free multiplayer .io territory game. Draw loops to claim turf, fight rivals, siege capitals, and climb the leaderboard.",
        "genre": ["io game", "multiplayer", "strategy"],
        "gamePlatform": "Web Browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any (modern web browser)",
        "playMode": "MultiPlayer",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <!-- PixiJS canvas mounts here, behind the UI overlays -->
    <div id="app"></div>

    <!-- Crawlable fallback for no-JS bots; replaced by the game when JS runs. -->
    <noscript>
      <h1>Turfgame.io</h1>
      <p>
        Turfgame.io is a free multiplayer .io game. Draw loops to claim turf, fight rivals in the
        open, siege enemy capitals, and climb the live leaderboard. JavaScript is required to play.
      </p>
    </noscript>

    <!-- Start screen (fades in on load) -->
    <div id="start-screen" class="overlay hidden">
      <div class="bg-decor" aria-hidden="true">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
        <span class="blob b3"></span>
        <span class="blob b4"></span>
        <span class="blob b5"></span>
      </div>
      <div class="modal">
        <div class="brand">
          <h1 class="title">Turf<span class="title-mid">game</span><span class="dot">.io</span></h1>
          <p class="tagline">Draw loops. Claim turf. Rule the map.</p>
        </div>

        <label class="field">
          <span>Name</span>
          <input
            id="name-input"
            type="text"
            maxlength="8"
            placeholder="your name"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <fieldset class="modes">
          <legend>Room</legend>
          <label><input type="radio" name="mode" value="random" checked /> Join a random room</label>
          <label><input type="radio" name="mode" value="specific" /> Join a specific room</label>
          <input
            id="room-code"
            type="text"
            class="room-code"
            placeholder="room code"
            autocomplete="off"
            spellcheck="false"
            disabled
          />
          <label><input type="radio" name="mode" value="create" /> Create a new room</label>
        </fieldset>

        <button id="play-btn" class="play" type="button">Play</button>
        <p id="form-error" class="error" role="alert"></p>

        <p class="howto">
          Move with the mouse. Hold left click to loop land and grab it. In the open, bigger
          wins. Your turf kills intruders. Drain a capital before you can take it.
        </p>
      </div>

      <a id="kofi-home" class="kofi kofi-home" target="_blank" rel="noopener noreferrer">
        <span class="kofi-cup">☕</span> Buy me a coffee
      </a>
    </div>

    <!-- In-game HUD (hidden until joined) -->
    <div id="game-hud" class="hud hidden">
      <button id="room-tag" class="room-tag" type="button" title="Click to copy the room code"></button>
      <button id="leave-btn" class="leave" type="button">Leave</button>
    </div>

    <!-- Top-left HUD: leaderboard + home compass (hidden until joined) -->
    <div id="hud-left" class="hud-left hidden">
      <div id="leaderboard-panel" class="lb-panel">
        <div class="lb-title">Leaderboard</div>
        <div id="leaderboard"></div>
      </div>
      <div id="combat-panel" class="combat-panel hidden">
        <div class="combat-title">In Combat</div>
        <div id="combat-list" class="combat-list"></div>
      </div>
      <div class="compass">
        <div class="compass-dial"><span id="compass-arrow" class="compass-arrow"></span></div>
        <span class="compass-label">Home</span>
      </div>
    </div>

    <!-- Location/zone banner (fades in, drifts down and out on zone change) -->
    <div id="zone-banner" class="zone-banner"></div>

    <!-- Intrusion alert (top; mirrors the zone banner, drifts up and out) -->
    <div id="alert-banner" class="alert-banner"></div>

    <!-- Arena news feed (bottom-left): joins, kills, conquests. Newest on top, fades out. -->
    <div id="events" class="events" aria-live="polite"></div>

    <!-- Subtle in-game donation link (bottom-right, hidden until joined) -->
    <a id="kofi-game" class="kofi kofi-game hidden" target="_blank" rel="noopener noreferrer">
      <span class="kofi-cup">☕</span> Buy me a coffee
    </a>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
