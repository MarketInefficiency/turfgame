<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Turf Studio</title>
    <style>
      :root {
        --bg: #0f1623;
        --card: rgba(17, 24, 39, 0.7);
        --border: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.9);
        --muted: rgba(255, 255, 255, 0.5);
        --turf: #4ade80;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; padding: 28px 16px 60px;
        background: linear-gradient(150deg, #121a33, #16243a 50%, #133035);
        color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .wrap { max-width: 760px; margin: 0 auto; }
      h1 { font-size: 24px; margin: 0 0 4px; }
      h2 { font-size: 16px; margin: 24px 0 10px; }
      .muted { color: var(--muted); font-size: 13px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-top: 16px; backdrop-filter: blur(12px); }
      label { display: block; margin: 12px 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
      input, select { width: 100%; padding: 10px 12px; font-size: 14px; color: #fff; background: rgba(255,255,255,0.08); border: 1px solid var(--border); border-radius: 10px; outline: none; }
      input:focus, select:focus { border-color: var(--turf); }
      select option { background: #16243a; color: #fff; }
      .row { display: flex; gap: 12px; }
      .row > div { flex: 1; }
      button { cursor: pointer; font-family: inherit; }
      .btn { width: 100%; margin-top: 16px; padding: 12px; font-size: 15px; font-weight: 800; color: #06281a; background: linear-gradient(180deg, #5de29a, #36c46e); border: none; border-radius: 11px; }
      .btn.secondary { color: var(--text); background: rgba(255,255,255,0.06); border: 1px solid var(--border); }
      .msg { min-height: 18px; margin-top: 12px; font-size: 13px; color: #ff8a80; }
      .msg.ok { color: var(--turf); }
      .hidden { display: none; }
      .topbar { display: flex; align-items: center; justify-content: space-between; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .chip { padding: 4px 9px; font-size: 12px; font-weight: 700; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: var(--text); cursor: pointer; }
      .chip:hover { border-color: var(--turf); }
      .tierline { margin-top: 6px; font-size: 13px; font-weight: 700; }
      .preview { margin-top: 10px; }
      .preview .skinprev { width: 64px; height: 64px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.85); background-size: cover; background-position: center; }
      .preview img { max-width: 80px; max-height: 80px; border-radius: 10px; }
      .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
      .item .thumb { width: 40px; height: 40px; border-radius: 8px; background-size: cover; background-position: center; flex: none; border: 1px solid var(--border); }
      .item .thumb.skin { border-radius: 50%; }
      .item .thumb.castle { display: flex; align-items: center; justify-content: center; padding: 3px; background: rgba(255,255,255,0.05); }
      .item .thumb.castle svg { width: 100%; height: 100%; display: block; }
      .item .meta { flex: 1; min-width: 0; }
      .item .meta b { font-size: 14px; }
      .item .meta .sub { font-size: 12px; color: var(--muted); }
      .item button { padding: 6px 10px; font-size: 12px; font-weight: 700; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: var(--text); }
      .item button.del { color: #ff8a80; border-color: rgba(255,138,128,0.4); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <h1>Turf Studio</h1>
        <button id="signout" class="chip hidden" type="button">Sign out</button>
      </div>
      <p class="muted">Admin only. Create and manage shop cosmetics.</p>

      <!-- Sign in -->
      <div id="login" class="card">
        <label>Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@email.com" />
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" />
        <button id="login-btn" class="btn" type="button">Sign in</button>
        <p id="login-msg" class="msg"></p>
      </div>

      <!-- Creator -->
      <div id="studio" class="hidden">
        <div class="card">
          <h2>New cosmetic</h2>
          <div class="row">
            <div>
              <label>Name</label>
              <input id="name" type="text" placeholder="Dragon Scale" />
            </div>
            <div>
              <label>Type</label>
              <select id="type">
                <option value="skin">Skin (wraps the avatar)</option>
                <option value="hat">Hat / Helmet</option>
                <option value="hair">Hair</option>
                <option value="shirt">Shirt / Chestplate</option>
                <option value="capital">Capital</option>
                <option value="sword">Sword</option>
                <option value="cloak">Cloak / Wings (members)</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div>
              <label>ID (unique slug)</label>
              <input id="id" type="text" placeholder="skin_dragon" />
            </div>
            <div>
              <label>Price (medals)</label>
              <input id="cost" type="number" min="0" step="50" value="500" />
            </div>
          </div>
          <label>Rotation chance (0.00001 to 1)</label>
          <input id="rarity" type="number" min="0.00001" max="1" step="0.0001" value="0.2" />
          <div class="chips">
            <span class="chip" data-r="0.5">Common</span>
            <span class="chip" data-r="0.2">Rare</span>
            <span class="chip" data-r="0.06">Epic</span>
            <span class="chip" data-r="0.01">Legendary</span>
            <span class="chip" data-r="0.00001">Mythic</span>
          </div>
          <div id="tierline" class="tierline"></div>
          <div class="row">
            <div>
              <label>Colour (builtin skins/swords — used when no image)</label>
              <input id="color" type="color" value="#ff5a52" style="height:42px;width:100%" />
            </div>
            <div>
              <label>Sword length (short = dagger, long = sword)</label>
              <select id="length">
                <option value="long">Long (sword)</option>
                <option value="short">Short (dagger)</option>
              </select>
            </div>
          </div>
          <label>Sword flare texture (png/gif, shown when ganged)</label>
          <input id="flare" type="file" accept="image/png,image/webp,image/gif" />
          <label>Image / GIF — optional for swords (png, webp, gif)</label>
          <input id="image" type="file" accept="image/png,image/webp,image/gif" />
          <div id="preview" class="preview"></div>
          <button id="create-btn" class="btn" type="button">Create cosmetic</button>
          <button id="cancel-edit" class="chip hidden" type="button" style="margin-left:8px">Cancel edit</button>
          <p id="create-msg" class="msg"></p>
        </div>

        <div class="card">
          <div class="topbar">
            <h2 style="margin:0">Existing items</h2>
            <button id="reshuffle" class="chip" type="button">Reshuffle shop now</button>
          </div>
          <p id="reshuffle-msg" class="msg" style="margin-top:8px"></p>
          <div id="items"></div>
        </div>
      </div>
    </div>

      function thumbHtml(c) {
        if (c.image_url) return `<div class="thumb" style="background-image:url(${c.image_url})"></div>`;
        if (c.type === "hat" && HAT_SVGS[c.id]) return `<div class="thumb castle">${HAT_SVGS[c.id]}</div>`;
        if (c.type === "hair" && HAIR_SVGS[c.id]) return `<div class="thumb castle">${HAIR_SVGS[c.id]}</div>`;
        if (c.type === "shirt" && SHIRT_SVGS[c.id]) return `<div class="thumb castle">${SHIRT_SVGS[c.id]}</div>`;
        if (c.type === "capital") return `<div class="thumb castle">${CASTLE_SVGS[c.design] || CASTLE_SVGS.default}</div>`;
        if (c.type === "cloak") {
          if (c.design === "wings_dragon") return `<div class="thumb castle">${dragonWings(c.color)}</div>`;
          if (c.design === "wings_angel") return `<div class="thumb castle">${angelWings(c.color)}</div>`;
          if (CLOAK_SVGS[c.id]) return `<div class="thumb castle">${CLOAK_SVGS[c.id]}</div>`;
        }
        if (c.type === "sword" && SWORD_SVGS[c.id]) return `<div class="thumb castle">${SWORD_SVGS[c.id]}</div>`;
        if (c.color) return `<div class="thumb${c.type === "skin" ? " skin" : ""}" style="background:${c.color}"></div>`;
        return `<div class="thumb"></div>`;
      }

      function tierOf(r) {
        if (r >= 0.4) return ["Common", "#9fb0c3"];
        if (r >= 0.15) return ["Rare", "#4aa3ff"];
        if (r >= 0.04) return ["Epic", "#a96bff"];
        if (r >= 0.005) return ["Legendary", "#f2b63c"];
        return ["Mythic", "#ff5a52"];
      }
      function refreshTier() {
        const r = parseFloat($("rarity").value) || 0;
        const [name, color] = tierOf(r);
        $("tierline").innerHTML = `<span style="color:${color}">${name}</span> · ${(r * 100).toFixed(r < 0.01 ? 4 : 1)}% chance to appear each day`;
      }
      $("rarity").addEventListener("input", refreshTier);
      document.querySelectorAll(".chip[data-r]").forEach((c) =>
        c.addEventListener("click", () => { $("rarity").value = c.dataset.r; refreshTier(); }),
      );
      refreshTier();

      // auto-suggest an id from the name + type
      $("name").addEventListener("input", () => {
        if ($("id").dataset.touched) return;
        const slug = $("name").value.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
        $("id").value = slug ? `${$("type").value.slice(0, 4)}_${slug}` : "";
      });
      $("id").addEventListener("input", () => ($("id").dataset.touched = "1"));

      let imgFile = null;
      $("image").addEventListener("change", () => {
        imgFile = $("image").files[0] || null;
        const p = $("preview");
        p.innerHTML = "";
        if (!imgFile) return;
        const url = URL.createObjectURL(imgFile);
        if ($("type").value === "skin") {
          const d = document.createElement("div");
          d.className = "skinprev";
          d.style.backgroundImage = `url(${url})`;
          p.appendChild(d);
        } else {
          const im = document.createElement("img");
          im.src = url;
          p.appendChild(im);
        }
      });

      let flareFile = null;
      $("flare").addEventListener("change", () => { flareFile = $("flare").files[0] || null; });

      // Upload art to the cosmetics bucket and return its public URL.
      async function uploadArt(file, type, id, suffix) {
        const ext = (file.name.split(".").pop() || "png").toLowerCase();
        const path = `${type}/${id}${suffix}.${ext}`;
        const up = await sb.storage.from("cosmetics").upload(path, file, { upsert: true, contentType: file.type });
        if (up.error) throw up.error;
        return sb.storage.from("cosmetics").getPublicUrl(path).data.publicUrl;
      }

      // Edit mode: load an existing item into the form and update instead of insert.
      let editingId = null;
      function startEdit(c) {
        editingId = c.id;
        $("name").value = c.name || "";
        $("type").value = c.type;
        $("id").value = c.id;
        $("id").disabled = true;
        $("cost").value = c.medal_cost ?? 0;
        $("rarity").value = c.rarity ?? 0.2;
        if (c.color) $("color").value = c.color;
        if (c.type === "sword") $("length").value = c.design === "short" ? "short" : "long";
        $("image").value = ""; $("flare").value = ""; $("preview").innerHTML = "";
        imgFile = null; flareFile = null;
        refreshTier();
        $("create-btn").textContent = "Save changes";
        show($("cancel-edit"), true);
        $("create-msg").textContent = "";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function endEdit() {
        editingId = null;
        $("id").disabled = false;
        $("id").value = ""; $("name").value = "";
        $("image").value = ""; $("flare").value = ""; $("preview").innerHTML = "";
        imgFile = null; flareFile = null;
        $("create-btn").textContent = "Create cosmetic";
        show($("cancel-edit"), false);
      }
      $("cancel-edit").addEventListener("click", endEdit);

      function setMsg(el, text, ok) {
        el.textContent = text;
        el.classList.toggle("ok", !!ok);
      }

      async function gateToAdmin() {
        const { data } = await sb.rpc("is_admin");
        if (!data) {
          setMsg($("login-msg"), "That account isn't an admin.");
          await sb.auth.signOut();
          return false;
        }
        show($("login"), false);
        show($("studio"), true);
        show($("signout"), true);
        void loadItems();
        return true;
      }

      $("login-btn").addEventListener("click", async () => {
        setMsg($("login-msg"), "Signing in…");
        const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
        if (error) return setMsg($("login-msg"), error.message);
        await gateToAdmin();
      });
      $("signout").addEventListener("click", async () => {
        await sb.auth.signOut();
        location.reload();
      });

      async function loadItems() {
        const { data } = await sb.from("cosmetics").select("id,type,name,medal_cost,rarity,kind,image_url,color,design,active,free,is_default,flare_url").order("created_at", { ascending: false });
        const host = $("items");
        host.innerHTML = "";
        (data ?? []).forEach((c) => {
          const [tier, color] = tierOf(c.rarity);
          const row = document.createElement("div");
          row.className = "item";
          row.innerHTML =
            thumbHtml(c) +
            `<div class="meta"><b>${c.name ?? c.id}</b> <span class="sub">${c.type} · ${c.medal_cost} medals · <span style="color:${color}">${tier}</span>${c.flare_url ? " · flare" : ""}${c.is_default ? " · default" : ""}${c.active ? "" : " · hidden"}</span></div>`;
          if (!c.is_default) {
            const edit = document.createElement("button");
            edit.textContent = "Edit";
            edit.onclick = () => startEdit(c);
            const toggle = document.createElement("button");
            toggle.textContent = c.active ? "Hide" : "Show";
            toggle.onclick = async () => { await sb.from("cosmetics").update({ active: !c.active }).eq("id", c.id); loadItems(); };
            const del = document.createElement("button");
            del.textContent = "Delete";
            del.className = "del";
            del.onclick = async () => { if (confirm(`Delete ${c.name}?`)) { await sb.from("cosmetics").delete().eq("id", c.id); loadItems(); } };
            row.appendChild(edit);
            row.appendChild(toggle);
            row.appendChild(del);
          }
          host.appendChild(row);
        });
      }

      $("create-btn").addEventListener("click", async () => {
        const id = editingId || $("id").value.trim();
        const name = $("name").value.trim();
        const type = $("type").value;
        const cost = parseInt($("cost").value, 10) || 0;
        const rarity = Math.min(1, Math.max(0.00001, parseFloat($("rarity").value) || 0));
        const color = $("color").value;
        if (!id || !name) return setMsg($("create-msg"), "Name and ID are required.");
        // Skins/capitals need their image; a sword can be a coloured blade (image optional) + flare.
        if (!editingId && !imgFile && type !== "sword") return setMsg($("create-msg"), "Pick an image or GIF.");
        setMsg($("create-msg"), editingId ? "Saving…" : "Uploading…");
        try {
          const fields = { type, name, medal_cost: cost, rarity, color };
          if (type === "sword") fields.design = $("length").value; // "long" | "short" blade length
          if (imgFile) { fields.image_url = await uploadArt(imgFile, type, id, ""); fields.kind = "image"; }
          else if (!editingId) fields.kind = "builtin"; // new colour-only cosmetic
          if (flareFile) fields.flare_url = await uploadArt(flareFile, type, id, "_flare");
          const res = editingId
            ? await sb.from("cosmetics").update(fields).eq("id", id)
            : await sb.from("cosmetics").insert({ id, free: false, is_default: false, active: true, ...fields });
          if (res.error) throw res.error;
          setMsg($("create-msg"), `${editingId ? "Saved" : "Created"} "${name}".`, true);
          endEdit();
          loadItems();
        } catch (e) {
          setMsg($("create-msg"), e.message || "Couldn't save that item.");
        }
      });

      $("reshuffle").addEventListener("click", async () => {
        setMsg($("reshuffle-msg"), "Reshuffling…");
        const { error } = await sb.rpc("admin_reshuffle");
        setMsg($("reshuffle-msg"), error ? error.message : "Shop reshuffled. New rotation is live.", !error);
      });

      // already signed in?
      sb.auth.getSession().then(({ data }) => { if (data.session) gateToAdmin(); });
    </script>
  </body>
</html>
