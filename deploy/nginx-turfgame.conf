# Turfgame.io — nginx site config.
#
# EDIT THESE before using:
#   • play.example.com            → your domain (every occurrence)
#   • /etc/letsencrypt/live/...    → your real certificate paths
#   • /home/deploy/turfgame        → where you uploaded the project on the VPS
#
# If your SSL provider/certbot ALREADY created an "443 ssl" server block for your
# domain, don't add a second one — just copy the `root`, `index`, `location /`, and
# `location /colyseus/` lines into that existing block instead.

server {
    listen 80;
    listen [::]:80;
    server_name play.example.com;
    return 301 https://$host$request_uri;   # send everyone to HTTPS
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name play.example.com;

    ssl_certificate     /etc/letsencrypt/live/play.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.example.com/privkey.pem;

    # The built static client.
    root /home/deploy/turfgame/client/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Colyseus game server (HTTP matchmaking + WebSocket) listening on :2567.
    # The trailing slash on proxy_pass strips the /colyseus/ prefix before forwarding.
    location /colyseus/ {
        proxy_pass http://127.0.0.1:2567/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;        # required for WebSocket
        proxy_set_header Connection "upgrade";         # required for WebSocket
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
